name: Add media

on:
  push:
    branches: [main]
    paths:
      - "assets/incoming/gallery/**"
      - "assets/incoming/stills/**"

permissions:
  contents: write

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Process incoming media
        run: python scripts/process_incoming.py

      - name: Commit changes
        run: |
          git config user.name "hila-galant-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html assets/gallery assets/stills assets/incoming
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Add new media from incoming folder"
            git push
          fi
