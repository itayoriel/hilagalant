name: Reorder media

on:
  push:
    branches: [main]
    paths:
      - "order/videos.txt"
      - "order/stills.txt"

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Rebuild index.html from order files
        run: python -c "import sys; sys.path.insert(0, 'scripts'); import gallery_lib; gallery_lib.rebuild_index_html()"

      - name: Commit changes
        run: |
          git config user.name "hila-galant-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Reorder media per order files"
            git push
          fi
